services:
  handover_app_a:
    build: .
    container_name: handover_app_a
    environment:
      HANDOVER_DATA_DIR: /app/data
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
    volumes:
      - handover_data:/app/data

  handover_app_b:
    build: .
    container_name: handover_app_b
    environment:
      HANDOVER_DATA_DIR: /app/data
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
    volumes:
      - handover_data:/app/data

  gateway:
    image: nginx:1.27-alpine
    container_name: handover_gateway
    depends_on:
      - handover_app_a
      - handover_app_b
    ports:
      - "8080:80"
    volumes:
      - ./deployment/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  handover_data: